<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Branding & SEO -->
    <title>MosesTech Fix AI — IT Diagnostics & Computer Repair Helpdesk</title>
    <meta name="description" content="AI-powered IT diagnostics for Windows laptops, desktops, printers, and networks. Step-by-step troubleshooting, photo error inspection, and technician booking by MosesTech Fix Solution in Kampala, Uganda." />
    <meta name="keywords" content="IT diagnostics, computer repair, laptop fix, printer repair, MosesTech, Kampala Uganda, technician booking, AI hardware troubleshoot" />
    <meta name="author" content="Moses Mwesigwa / MosesTech Fix Solution" />
    <meta name="theme-color" content="#020617" />
    
    <!-- App Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / WhatsApp / Facebook Preview Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MosesTech Fix AI" />
    <meta property="og:title" content="MosesTech Fix AI — Smart IT Diagnostics & Computer Repair" />
    <meta property="og:description" content="Diagnose Windows blue screens, printer jams, and hardware faults in seconds with AI and local technician support." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1588702547919-26089e690ecc?w=800&auto=format&fit=crop&q=80" />
    <meta property="og:url" content="https://mosestechfixsolution.com" />

    <!-- Twitter / X Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MosesTech Fix AI — Smart IT Diagnostics" />
    <meta name="twitter:description" content="Diagnose PC, printer, and network issues with AI and on-demand IT technician dispatch." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1588702547919-26089e690ecc?w=800&auto=format&fit=crop&q=80" />

    <!-- iOS Safari Web App Compatibility -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MosesTech AI" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950 min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('Service Worker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
