services:
  - type: web
    name: mosestechfix-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_ACTIVATION_SECRET
        sync: false
